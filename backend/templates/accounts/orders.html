{% extends 'base.html' %}
{% block title %}My Orders — Flipko{% endblock %}
{% block content %}
<div class="container py-5">
    <h2 class="fw-bold mb-4"><i class="fas fa-shopping-bag me-2 text-primary"></i>My Orders</h2>
    <div class="card shadow-sm p-5 text-center border-0 rounded-4">
        <i class="fas fa-box-open text-muted mb-4" style="font-size: 5rem; opacity:0.3;"></i>
        <h4 class="text-muted fw-semibold">No orders yet!</h4>
        <p class="text-muted">Looks like you haven't placed any orders. Browse our products and start shopping!</p>
        <a href="{% url 'home' %}" class="btn btn-primary fw-semibold px-4 py-2 mt-2 mx-auto"
            style="width:fit-content;">Browse Products</a>
    </div>
</div>
{% endblock %}
