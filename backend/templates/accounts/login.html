{% extends 'base.html' %}
{% block title %}Login | Flipko{% endblock %}

{% block content %}
<style>
    :root {
      /* Website brand colors from base.html logo */
      --glow-color: #3b82f6;
      --glow-color-dark: #1e3a8a;
      --accent-color: #facc15;
    }

    .form-label {
        font-weight: 500;
        font-size: 0.95rem;
        margin-bottom: 0.5rem;
        display: block;
    }

    /* Target inputs using CSS variables that adapt native to light/dark mode if needed */
    .form-control, input[type="text"], input[type="password"], input[type="email"] {
        background-color: var(--fk-bg, rgba(255, 255, 255, 0.8)) !important;
        border: 1px solid rgba(0, 0, 0, 0.1) !important;
        border-radius: 12px;
        color: var(--fk-text, #333) !important;
        padding: 0.9rem 1.25rem;
        font-size: 1rem;
        transition: all 0.3s ease;
        width: 100%;
        display: block;
        box-sizing: border-box;
        box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
    }
    
    [data-theme="dark"] .form-control, 
    [data-theme="dark"] input[type="text"], 
    [data-theme="dark"] input[type="password"], 
    [data-theme="dark"] input[type="email"] {
        background-color: rgba(255, 255, 255, 0.05) !important;
        border: 1px solid rgba(255, 255, 255, 0.1) !important;
        color: #fff !important;
    }

    .form-control:focus, input[type="text"]:focus, input[type="password"]:focus, input[type="email"]:focus {
        background-color: var(--fk-bg-elevate, #fff) !important;
        border-color: var(--glow-color) !important;
        box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15) !important;
        outline: none;
    }

    [data-theme="dark"] .form-control:focus,
    [data-theme="dark"] input[type="text"]:focus,
    [data-theme="dark"] input[type="password"]:focus,
    [data-theme="dark"] input[type="email"]:focus {
        background-color: rgba(255, 255, 255, 0.08) !important;
        box-shadow: 0 0 15px rgba(59, 130, 246, 0.3) !important;
    }

    .auth-wrapper {
        background: var(--fk-card-bg, #ffffff);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid var(--fk-border, rgba(0,0,0,0.05));
        border-radius: 24px;
        padding: 3rem 2.5rem;
        box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.1);
        position: relative;
        overflow: hidden;
    }

    [data-theme="dark"] .auth-wrapper {
        background: rgba(20, 20, 25, 0.7);
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8), 0 0 40px rgba(59, 130, 246, 0.05);
    }

    .auth-wrapper::before {
        content: '';
        position: absolute;
        top: -50px;
        right: -50px;
        width: 150px;
        height: 150px;
        background: radial-gradient(circle, var(--accent-color) 0%, transparent 70%);
        opacity: 0.15;
        border-radius: 50%;
        pointer-events: none;
    }

    .glow-button {
      width: 100%;
      padding: 0.9rem;
      border: none;
      background: linear-gradient(135deg, var(--glow-color-dark), var(--glow-color));
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 8px 20px rgba(30, 58, 138, 0.3);
      color: var(--accent-color);
      margin-top: 1rem;
      display: inline-block;
      text-align: center;
      text-transform: uppercase;
    }

    .glow-button:hover {
      transform: scale(1.02) translateY(-2px);
      box-shadow: 0 15px 30px rgba(30, 58, 138, 0.4), 0 0 20px var(--glow-color);
      color: #fff;
    }
    
    .glow-button:active {
      transform: scale(0.98);
    }

    .login-heading {
      font-size: 2.2rem;
      font-weight: 800;
      text-align: center;
      margin-bottom: 2rem;
      background: linear-gradient(135deg, var(--glow-color), var(--glow-color-dark));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }

    [data-theme="dark"] .login-heading {
        background: linear-gradient(135deg, #fff, var(--glow-color));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    .help-text {
        text-align: center;
        margin-top: 2rem;
        font-size: 0.95rem;
        color: var(--fk-text-muted, #6b7280);
    }

    .help-link {
        color: var(--glow-color);
        text-decoration: none;
        font-weight: 600;
        transition: all 0.2s;
        margin-left: 0.25rem;
    }

    .help-link:hover {
        color: var(--glow-color-dark);
        text-shadow: 0 0 10px rgba(59, 130, 246, 0.3);
    }
</style>

<div class="row justify-content-center mt-5 mb-5 align-items-center" style="min-height: 70vh;">
    <div class="col-md-7 col-lg-5">
        <div class="auth-wrapper mb-4">
            <h3 class="login-heading">Welcome Back</h3>
            <form method="post">
                {% csrf_token %}
                {% for field in form %}
                <div class="mb-4">
                    <label class="form-label">{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}
                    <div class="text-danger small mt-2" style="color: #ef4444 !important; font-weight: 500;">
                        <i class="fas fa-exclamation-circle me-1"></i>{{ field.errors|striptags }}
                    </div>
                    {% endif %}
                </div>
                {% endfor %}
                <div class="d-grid mt-4">
                    <button type="submit" class="glow-button">Sign In</button>
                </div>
            </form>
            <div class="help-text">
                New to Flipko? <a href="{% url 'register' %}" class="help-link">Create an account</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
