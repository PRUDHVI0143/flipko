{% extends 'base.html' %}
{% block title %}Notification Preferences — Flipko{% endblock %}
{% block content %}
<div class="container py-5" style="max-width: 640px;">
    <h2 class="fw-bold mb-4"><i class="fas fa-bell me-2 text-primary"></i>Notification Preferences</h2>
    <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
        {% for item in notification_items %}
        <div class="d-flex align-items-center justify-content-between px-4 py-3 border-bottom">
            <div>
                <p class="mb-0 fw-semibold">{{ item.label }}</p>
            </div>
            <div class="form-check form-switch mb-0">
                <input class="form-check-input" type="checkbox" role="switch" {% if item.default %}checked{% endif %}
                    style="cursor:pointer;">
            </div>
        </div>
        {% empty %}
        <p class="text-muted p-4">No notification settings available.</p>
        {% endfor %}
    </div>
    <button class="btn btn-primary fw-semibold mt-4 px-4">Save Preferences</button>
</div>
{% endblock %}
