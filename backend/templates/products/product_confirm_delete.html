{% extends 'base.html' %}
{% block title %}Confirm Delete | Flipko Admin{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6">
        <div class="card shadow border-danger">
            <div class="card-body text-center p-5">
                <i class="fas fa-exclamation-triangle fa-4x text-danger mb-4"></i>
                <h3 class="fw-bold mb-3">Delete {{ product.name }}?</h3>
                <p class="text-muted mb-4">Are you sure you want to permanently delete this product? This action cannot
                    be undone.</p>
                <form method="post">
                    {% csrf_token %}
                    <a href="{% url 'product_detail' product.id %}" class="btn btn-light px-4 py-2 me-2">Cancel</a>
                    <button type="submit" class="btn btn-danger px-4 py-2 fw-bold">Yes, Delete</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
