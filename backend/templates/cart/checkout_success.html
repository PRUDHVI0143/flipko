{% extends 'base.html' %}
{% block title %}Order Successful | Flipko{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6">
        <div class="card shadow-lg border-0 text-center py-5 rounded-3">
            <div class="card-body">
                <div class="mb-4">
                    <i class="fas fa-check-circle text-success" style="font-size: 80px;"></i>
                </div>
                <h2 class="fw-bold text-success mb-3">Order Placed Successfully!</h2>
                <p class="text-muted fs-5 mb-4">Thank you for shopping with Flipko.</p>
                <div class="alert alert-light border d-inline-block mx-auto text-start mb-5 shadow-sm">
                    <div class="mb-2"><span class="text-muted">Order ID:</span> <span class="fw-bold">#FLK-{{
                            order.id|default:request.user.id }}</span></div>
                    <div><span class="text-muted">Expected Delivery:</span> <span class="fw-bold text-primary">In 3-5
                            Business Days</span></div>
                </div>
                <div>
                    <a href="{% url 'home' %}"
                        class="btn btn-primary px-5 py-2 fw-bold shadow-sm rounded-1 w-75 fs-5">Continue Shopping</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
